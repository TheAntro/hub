name: PR env deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-hono-pr-env:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.parse_url.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Deploy Hono
        id: hono_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload  --preview-alias pr-${{ github.event.number }}
          workingDirectory: apps/backend
      - name: Extract URL
        id: parse_url
        env:
          LOGS: ${{ steps.hono_deploy.outputs.command-output }}
        run: |
          URL=$(echo "$LOGS" | grep "Preview Alias URL" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-astro-pr-env:
    runs-on: ubuntu-latest
    needs: deploy-hono-pr-env
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Build Astro
        run: pnpm build:astro
        env:
          API_URL: ${{ needs.deploy-hono-pr-env.outputs.url }}
      - name: Deploy Preview
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --preview-alias pr-${{ github.event.number }}
          workingDirectory: apps/frontend
